[project]
name = "streamlit_app"
version = "1.0.0"
description = "Machine Learning application for predicting unemployment in Jamaica using XGBoost"
requires-python = ">=3.11,<3.13"

dependencies = [
    "streamlit>=1.46.0",
    "pandas>=2.2.2",
    "numpy>=2.2.0",
    "scikit-learn>=1.6.1",
    "xgboost>=3.0.2",
    "plotly>=6.0.0"
]